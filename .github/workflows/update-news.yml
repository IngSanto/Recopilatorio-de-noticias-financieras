name: Actualizar noticias y publicar sitio

on:
  schedule:
    # 3 corridas al día (~cada 8 h), en horarios de mercado mexicano.
    # OJO: el cron de GitHub se define en UTC. CDMX = UTC-6 todo el año (sin horario de verano desde 2022).
    # Se usa el minuto :30 a propósito: los cron en punto (:00) son los más saturados en GitHub Actions y se retrasan más.
    - cron: "30 12 * * *" # 06:30 CDMX - antes de la apertura (BMV 8:30). Recoge la noche: Asia, Europa, EE.UU. pre-market.
    - cron: "30 21 * * *" # 15:30 CDMX - después del cierre (BMV y NYSE cierran 15:00 CDMX). Recoge toda la sesión.
    - cron: "30 5 * * *" #  23:30 CDMX - cierre del día noticioso. Recoge reportes after-hours y notas de la tarde.
    # GitHub solo ejecuta 'schedule' desde la rama por defecto del repo (main).
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/**"
      - "index.html"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar noticias y generar data/news.json
        run: python3 scripts/fetch_news.py

      - name: Revisar si cambió algo
        id: diff
        run: |
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push de data/news.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: actualizar noticias automáticamente"
          git push

  deploy:
    needs: update-data
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
